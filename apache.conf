<VirtualHost *:80>
    ServerName portal.mclinic.co.ke
    ServerAlias www.portal.mclinic.co.ke

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.mclinic.co.ke
    ServerAlias www.portal.mclinic.co.ke

    # SSL Configuration
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/portal.mclinic.co.ke/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/portal.mclinic.co.ke/privkey.pem
    
    ProxyPreserveHost On
    ProxyRequests Off

    # MClinic API - Port 7899
    # Note: NestJS uses /api prefix internally
    ProxyPass /api http://127.0.0.1:7899/api
    ProxyPassReverse /api http://127.0.0.1:7899/api

    # MClinic Web - Port 7898
    ProxyPass / http://127.0.0.1:7898/
    ProxyPassReverse / http://127.0.0.1:7898/

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:7898/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/mclinic-error.log
    CustomLog ${APACHE_LOG_DIR}/mclinic-access.log combined
</VirtualHost>
