<VirtualHost *:80>
    ServerName portal.mclinic.co.ke
    ServerAlias www.portal.mclinic.co.ke

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName portal.mclinic.co.ke
    ServerAlias www.portal.mclinic.co.ke

    # SSL Configuration (Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/portal.mclinic.co.ke/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/portal.mclinic.co.ke/privkey.pem
    
    # SSL Security Settings
    SSLProtocol all -SSLv2 -SSLv3
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/mclinic-error.log
    CustomLog ${APACHE_LOG_DIR}/mclinic-access.log combined

    # API Proxy - Forward /api requests to port 3434 (NestJS)
    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3434/api
    ProxyPassReverse /api http://127.0.0.1:3434/api

    # WebSocket support for API
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/api/(.*) "ws://127.0.0.1:3434/$1" [P,L]

    # Frontend Proxy - Forward all other requests to port 5054 (Next.js)
    ProxyPass / http://127.0.0.1:5054/
    ProxyPassReverse / http://127.0.0.1:5054/

    # Security Headers
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer-when-downgrade"

    # Compression
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript application/javascript application/json
    </IfModule>

    # Cache static assets
    <FilesMatch "\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>

    # Upload size limit
    LimitRequestBody 52428800
</VirtualHost>
