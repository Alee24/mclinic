name: Build Android App for Play Store

on:
  workflow_dispatch:
    # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        
      - name: Set Up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          
      - name: Install Dependencies
        working-directory: apps/mobile_flutter
        run: flutter pub get
        
      - name: Build App Bundle
        working-directory: apps/mobile_flutter
        run: flutter build appbundle --release
        
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: playstore-appbundle
          path: apps/mobile_flutter/build/app/outputs/bundle/release/app-release.aab
