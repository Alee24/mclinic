services:
  db:
    image: mysql:8.0
    container_name: mclinic-db
    restart: always
    environment:
      MYSQL_DATABASE: mclinicportal
      MYSQL_USER: m-cl-app
      MYSQL_PASSWORD: Mclinic@App2023?
      MYSQL_ROOT_PASSWORD: root_password_change_me
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: mclinic-api
    restart: always
    ports:
      - "7899:7899"
    volumes:
      - uploads_data:/app/apps/api/uploads
      - ./apps/api/.env:/app/apps/api/.env
    environment:
      - PORT=7899
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=m-cl-app
      - DB_PASSWORD=Mclinic@App2023?
      - DB_NAME=mclinicportal
      - JWT_SECRET=your_jwt_secret_change_me
      - FRONTEND_URL=https://portal.mclinic.co.ke
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: mclinic-web
    restart: always
    ports:
      - "7898:7898"
    environment:
      - PORT=7898
      - NEXT_PUBLIC_API_URL=https://portal.mclinic.co.ke/api
    depends_on:
      - api

volumes:
  db_data:
  uploads_data:
